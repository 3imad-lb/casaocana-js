       <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Initialisation de la date et de l'heure
            const dateElement = document.querySelector("#h h1:nth-child(2)");
            const heureElement = document.querySelector("#h h1:nth-child(3)");
        
            const updateDateTime = () => {
                const now = new Date();
                dateElement.textContent = `Date : ${now.toLocaleDateString()}`;
                heureElement.textContent = `Heure : ${now.toLocaleTimeString()}`;
            };
        
            updateDateTime();
            setInterval(updateDateTime, 1000);
        
            // Demander le nom une seule fois au chargement de la page
            const stockManagerName = prompt("Entrez le nom du gestionnaire d'ustensiles :", "Gestionnaire");
            const nameElement = document.querySelector("#h h1:first-child");
            nameElement.textContent = `Nom caissier : ${stockManagerName}`;
        
            // Gestion des boutons Ajouter et Soustraire
            document.querySelectorAll("tr.trcharge").forEach(row => {
                const addButton = row.querySelector(".add");
                const subtractButton = row.querySelector(".subtract");
                const sortieCell = row.querySelector(".sortie");
                const inputField = row.querySelector(".nombre");
        
                // Bouton Ajouter (vert)
                addButton.addEventListener("click", (e) => {
                    e.preventDefault(); // Empêche tout comportement par défaut
                    const inputValue = parseInt(inputField.value) || 0;
                    const currentValue = parseInt(sortieCell.textContent) || 0;
                    sortieCell.textContent = currentValue + inputValue;
                });
        
                // Bouton Soustraire (rouge)
                subtractButton.addEventListener("click", (e) => {
                    e.preventDefault(); // Empêche tout comportement par défaut
                    const inputValue = parseInt(inputField.value) || 0;
                    const currentValue = parseInt(sortieCell.textContent) || 0;
                    const newValue = currentValue - inputValue;
                    sortieCell.textContent = newValue < 0 ? 0 : newValue; // Empêche les valeurs négatives
                });
            });
        });


        document.addEventListener("DOMContentLoaded", () => {
    const toggleButton = document.getElementById("darkModeToggle");
    const body = document.body;

    // Vérifie si un mode est déjà enregistré dans localStorage
    if (localStorage.getItem("dark-mode") === "enabled") {
        enableDarkMode();
    }

    // Basculer entre les modes
    toggleButton.addEventListener("click", () => {
        if (body.classList.contains("dark-mode")) {
            disableDarkMode();
        } else {
            enableDarkMode();
        }
    });

    function enableDarkMode() {
        body.classList.add("dark-mode");
        localStorage.setItem("dark-mode", "enabled");
        toggleButton.textContent = "☀️";
    }

    function disableDarkMode() {
        body.classList.remove("dark-mode");
        localStorage.setItem("dark-mode", "disabled");
        toggleButton.textContent = "🌙";
    }
});
